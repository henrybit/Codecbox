# 跨平台编译打包：Windows / macOS (arm64 + x64) / Linux
# 触发：打 v* 标签，或手动 workflow_dispatch
#
# 仓库 Secrets（Settings → Secrets and variables → Actions）：
#
# --- macOS 代码签名（必需，用于签名 .app / .dmg）---
# APPLE_CERTIFICATE              Developer ID Application 证书 .p12 的 Base64
#                                openssl base64 -A -in certificate.p12 -out cert.txt
# APPLE_CERTIFICATE_PASSWORD     导出 .p12 时设置的密码
# APPLE_SIGNING_IDENTITY         可选；一般可不设，由证书自动推断
#                                例：Developer ID Application: Your Name (TEAMID)
#
# --- macOS 公证（二选一）---
# 方式 A — Apple ID：
#   APPLE_ID                     Apple ID 邮箱
#   APPLE_PASSWORD               App 专用密码（appleid.apple.com）
#   APPLE_TEAM_ID                团队 ID（developer.apple.com → Membership）
#
# 方式 B — App Store Connect API Key（更适合 CI，推荐）：
#   APPLE_API_KEY                Key ID（如 AB12CD34EF）
#   APPLE_API_ISSUER             Issuer ID（UUID）
#   APPLE_API_KEY_P8_BASE64      AuthKey_xxx.p8 文件的 Base64
#                                openssl base64 -A -in AuthKey_xxx.p8 -out key.txt
#
# --- 可选：Windows 代码签名 ---
# WINDOWS_CERTIFICATE            .pfx 的 Base64（certutil -encode certificate.pfx out.txt）
# WINDOWS_CERTIFICATE_PASSWORD   .pfx 导出密码

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_draft:
        description: '以草稿形式创建 GitHub Release'
        type: boolean
        default: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  publish-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
            rust_targets: aarch64-apple-darwin
            label: macos-aarch64
          - platform: macos-latest
            args: --target x86_64-apple-darwin
            rust_targets: x86_64-apple-darwin
            label: macos-x86_64
          - platform: ubuntu-22.04
            args: ''
            rust_targets: ''
            label: linux-x86_64
          - platform: windows-latest
            args: ''
            rust_targets: ''
            label: windows-x86_64

    runs-on: ${{ matrix.platform }}
    name: build (${{ matrix.label }})

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          shared-key: ${{ matrix.label }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Import Windows certificate
        if: matrix.platform == 'windows-latest'
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE)) {
            Write-Host "WINDOWS_CERTIFICATE not set; skip Windows code signing."
            exit 0
          }
          New-Item -ItemType Directory -Force -Path certificate | Out-Null
          Set-Content -Path certificate/tempCert.txt -Value $env:WINDOWS_CERTIFICATE
          certutil -decode certificate/tempCert.txt certificate/certificate.pfx
          Remove-Item certificate/tempCert.txt
          Import-PfxCertificate `
            -FilePath certificate/certificate.pfx `
            -CertStoreLocation Cert:\CurrentUser\My `
            -Password (ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -Force -AsPlainText)

      - name: Prepare Apple API key for notarization
        if: startsWith(matrix.platform, 'macos')
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
        run: |
          if [ -z "${APPLE_API_KEY_P8_BASE64}" ] || [ -z "${APPLE_API_KEY}" ]; then
            echo "Apple API Key not configured; notarization will use Apple ID secrets if present."
            exit 0
          fi
          mkdir -p "$HOME/private_keys"
          echo "$APPLE_API_KEY_P8_BASE64" | base64 --decode > "$HOME/private_keys/AuthKey_${APPLE_API_KEY}.p8"
          chmod 600 "$HOME/private_keys/AuthKey_${APPLE_API_KEY}.p8"
          echo "APPLE_API_KEY_PATH=$HOME/private_keys/AuthKey_${APPLE_API_KEY}.p8" >> "$GITHUB_ENV"
          echo "API_PRIVATE_KEYS_DIR=$HOME/private_keys" >> "$GITHUB_ENV"

      - name: Build and upload release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS 签名（Tauri bundler 会自动导入证书并签名）
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # 公证 — Apple ID
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # 公证 — API Key（与上面二选一；推荐）
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_PATH: ${{ env.APPLE_API_KEY_PATH }}
          API_PRIVATE_KEYS_DIR: ${{ env.API_PRIVATE_KEYS_DIR }}
        with:
          # 打标签推送时挂到该 tag；手动触发时按 tauri.conf.json 版本创建 app-vX.Y.Z
          # __VERSION__ 会被 tauri-action 替换为 tauri.conf.json 中的 version
          tagName: ${{ github.event_name == 'push' && github.ref_name || 'app-v__VERSION__' }}
          releaseName: ${{ github.event_name == 'push' && format('音视频转换器 {0}', github.ref_name) || '音视频转换器 v__VERSION__' }}
          releaseBody: |
            ## 音视频转换器

            下载对应平台安装包后安装即可。

            - **macOS**：`.dmg`（已签名；配置公证 Secrets 后会公证）
            - **Windows**：`.msi` / `.exe`
            - **Linux**：`.deb` / `.AppImage`

            运行时需要本机已安装 FFmpeg（含 `ffmpeg` / `ffprobe`）。
          releaseDraft: ${{ github.event_name != 'workflow_dispatch' || inputs.release_draft }}
          prerelease: false
          args: ${{ matrix.args }}
